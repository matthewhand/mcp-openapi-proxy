[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-openapi-proxy"
requires-python = ">=3.10"
version = "0.1.0"
description = "MCP server for exposing OpenAPI specifications as MCP tools."
readme = "README.md"
authors = [
  { name = "Matthew Hand", email = "matthewhandau@gmail.com" }
]
dependencies = [
  "mcp[cli]>=1.2.0",
  "python-dotenv>=1.0.1",
  "requests>=2.25.0",
  "fastapi>=0.100.0",
  "pydantic>=2.0",
  "prance>=23.6.21.0",
  "openapi-spec-validator>=0.7.1",
  "jmespath>=1.0.1",
]

[project.scripts]
mcp-openapi-proxy = "mcp_openapi_proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test"
]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.flake8]
max-line-length = 120
exclude = ".git,__pycache__,.venv,venv,build,dist,.eggs"
extend-ignore = "E203, E266, E501, W503, F403, F401"

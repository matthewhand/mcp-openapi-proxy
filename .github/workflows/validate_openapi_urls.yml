name: Validate OpenAPI URLs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-openapi-urls:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install curl
      run: sudo apt-get update && sudo apt-get install -y curl
    - name: Validate OpenAPI URLs
      run: python3 scripts/validate_openapi_urls.py
